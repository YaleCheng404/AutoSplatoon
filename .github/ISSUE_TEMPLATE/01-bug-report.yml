name: Bug report
description: Report a problem with image processing, device connection, or drawing.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first and check the [user guide](https://github.com/YaleCheng404/AutoSplatoon#readme) and [troubleshooting guide](https://github.com/YaleCheng404/AutoSplatoon/blob/master/docs/hardware.md#troubleshooting).
  - type: input
    id: version
    attributes:
      label: AutoSplatoon version
      description: Enter the release version or the commit for a local build.
      placeholder: e.g. v1.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and version
      placeholder: e.g. Windows 11 x64, macOS 15 on Apple Silicon, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what happened and what you expected. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps and say how often the issue happens. For image issues, attach the source image and include your preset and settings.
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Board and console
      description: For connection, flashing, or drawing issues, include your ESP32 board model, Switch model, system version, and game version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste the complete error or the log around the time it happened.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Include what you tried and attach any useful screenshots, recordings, or files.
