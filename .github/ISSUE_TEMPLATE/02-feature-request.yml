name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: Describe what you are doing and what problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed behavior
      description: Explain how you would like AutoSplatoon to work. A concrete example helps.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: References or additional information
      description: Share examples from other apps, screenshots, links, or your current workaround.
